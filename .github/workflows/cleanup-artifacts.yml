name: Cleanup Artifacts

# Reusable sweep of classified GitHub Actions artifacts. The caller owns the schedule and the
# patterns file. The sweep deletes artifacts older than older-than-hours only when the producing
# run concluded success or cancelled. Failing runs are left in place. A lookup failure is retried
# on a later schedule, so the sweep step continues on error.
on:
  workflow_call:
    inputs:
      older-than-hours:
        description: Age threshold passed to gha-artifacts-cleanup sweep
        type: string
        default: '6'
      patterns-file:
        description: JSON patterns file in the caller repository
        type: string
        required: true
      runs-on:
        description: Runner label
        type: string
        default: ubuntu-latest

permissions:
  contents: read

concurrency:
  group: cleanup-artifacts-sweep
  cancel-in-progress: false

jobs:
  cleanup-sweep:
    name: Sweep stale artifacts
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 27
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 1
        with:
          persist-credentials: false

      - name: Resolve tooling repository
        id: tooling
        timeout-minutes: 1
        env:
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          set -euo pipefail
          file_ref="${WORKFLOW_REF%%@*}"
          repository="${file_ref%%/.github/*}"
          case "$repository" in
            */*) ;;
            *) echo "::error::cannot resolve the called workflow repository"; exit 1 ;;
          esac
          echo "repository=$repository" >> "$GITHUB_OUTPUT"

      - name: Checkout tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 1
        with:
          repository: ${{ steps.tooling.outputs.repository }}
          ref: ${{ job.workflow_sha }}
          path: .tooling
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        timeout-minutes: 2
        with:
          node-version: 24

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        timeout-minutes: 2
        with:
          version: latest-12

      - name: Install and build the CLI
        timeout-minutes: 8
        working-directory: .tooling
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile --loglevel=warn
          pnpm --filter vouchington-tooling build

      - name: Validate sweep inputs
        timeout-minutes: 1
        env:
          OLDER_THAN_HOURS: ${{ inputs.older-than-hours }}
          PATTERNS_FILE: ${{ inputs.patterns-file }}
        run: |
          set -euo pipefail
          if [[ ! "$OLDER_THAN_HOURS" =~ ^[0-9]+([.][0-9]+)?$ ]]; then
            echo "::error::older-than-hours must be a number"
            exit 2
          fi
          if [[ -z "$PATTERNS_FILE" || "$PATTERNS_FILE" == -* || "$PATTERNS_FILE" == /* || "$PATTERNS_FILE" == *$'\n'* || "$PATTERNS_FILE" == *'..'* ]]; then
            echo "::error::patterns-file must be a repository path"
            exit 2
          fi

      - name: Sweep artifacts
        timeout-minutes: 12
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OLDER_THAN_HOURS: ${{ inputs.older-than-hours }}
          PATTERNS_FILE: ${{ inputs.patterns-file }}
        run: |
          set -euo pipefail
          node "$GITHUB_WORKSPACE/.tooling/packages/vouchington-tooling/bin/vouchington.mjs" \
            gha-artifacts-cleanup sweep \
            --older-than-hours "$OLDER_THAN_HOURS" \
            --patterns-file "$GITHUB_WORKSPACE/$PATTERNS_FILE"
