name: Release

on:
  workflow_dispatch:
    inputs:
      package:
        description: Package to publish
        type: choice
        required: true
        default: vouchington-tooling
        options:
          - vouchington-tooling
          - eslint-plugin-vouchington
      bump:
        description: Semver bump type
        type: choice
        required: true
        default: patch
        options:
          - patch
          - minor
          - major
          - premajor
          - preminor
          - prepatch
          - prerelease

permissions:
  contents: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # knip's oxc-parser OOMs on ubuntu-slim; match the CI test job.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check RELEASE_TOKEN is set
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_TOKEN" ]; then
            echo "::error::RELEASE_TOKEN secret is not set. It needs Contents Read & Write on this repository." >&2
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: main
          token: ${{ secrets.RELEASE_TOKEN }}

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.22.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          # npm trusted-publishing docs: do not cache the package manager on release.
          package-manager-cache: false

      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run build
      - run: pnpm run lint
      - run: pnpm run test:coverage
      - run: pnpm run actionlint

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump version, commit, tag
        id: bump
        env:
          PACKAGE: ${{ inputs.package }}
          BUMP: ${{ inputs.bump }}
        run: |
          pnpm --filter "$PACKAGE" version "$BUMP" --no-git-tag-version
          VERSION=$(node -p "require('./packages/${PACKAGE}/package.json').version")
          git add "packages/${PACKAGE}/package.json" pnpm-lock.yaml
          git commit -m "chore(release): ${PACKAGE} v${VERSION}"
          git tag -a "${PACKAGE}/v${VERSION}" -m "${PACKAGE} v${VERSION}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Push release commit and tag atomically
        env:
          PACKAGE: ${{ inputs.package }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: git push --atomic origin HEAD:main "refs/tags/${PACKAGE}/v${VERSION}"

      - name: Publish with npm OIDC
        working-directory: packages/${{ inputs.package }}
        run: npm publish --access public

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          gh release create "${{ inputs.package }}/v${{ steps.bump.outputs.version }}" \
            --title "${{ inputs.package }} v${{ steps.bump.outputs.version }}" \
            --generate-notes
