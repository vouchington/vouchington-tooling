name: Release

on:
  workflow_dispatch:
    inputs:
      action:
        description: Prepare a release PR or publish a merged release PR
        type: choice
        required: true
        options: [prepare, publish]
      package:
        description: Package to release
        type: choice
        required: true
        options: [vouchington-tooling, eslint-plugin-vouchington]
      bump:
        description: Semver bump (prepare only)
        type: choice
        required: false
        options: [patch, minor, major, premajor, preminor, prepatch, prerelease]
      version:
        description: Exact version (publish only)
        required: false
        type: string
      pr:
        description: Merged release PR number (publish only)
        required: false
        type: string

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    if: inputs.action == 'prepare'
    permissions: { contents: read }
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: main
          token: ${{ secrets.RELEASE_TOKEN }}
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 11.22.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run build
      - run: pnpm run lint
      - run: pnpm run test:coverage
      - run: pnpm run actionlint
      - name: Prepare release PR
        env:
          BUMP: ${{ inputs.bump }}
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          PACKAGE: ${{ inputs.package }}
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          test -n "$RELEASE_TOKEN" && test -n "$BUMP" || exit 1
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          pnpm --filter "$PACKAGE" version "$BUMP" --no-git-tag-version
          VERSION=$(node -p "require('./packages/' + process.env.PACKAGE + '/package.json').version")
          BRANCH="release/$PACKAGE-v$VERSION"
          TAG="$PACKAGE-v$VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG"; then exit 1; fi
          git add "packages/$PACKAGE/package.json" pnpm-lock.yaml
          EXPECTED_TREE=$(git write-tree)
          if git ls-remote --exit-code --heads origin "$BRANCH"; then
            git fetch origin "refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"
            test "$(git rev-parse "origin/$BRANCH^{tree}")" = "$EXPECTED_TREE" || exit 1
          else
            git switch -c "$BRANCH"
            git commit -m "chore(release): $PACKAGE v$VERSION"
            git push origin "HEAD:refs/heads/$BRANCH"
          fi
          gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[0].number' | grep -q . || \
            gh pr create --head "$BRANCH" --base main --title "chore(release): $PACKAGE v$VERSION" --body 'Prepared release; merge after required checks.'

  publish:
    if: inputs.action == 'publish'
    permissions: { contents: read, id-token: write }
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: main
          token: ${{ secrets.RELEASE_TOKEN }}
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 11.22.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Validate merged release PR and checkout its merge commit
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          PACKAGE: ${{ inputs.package }}
          PR: ${{ inputs.pr }}
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          test -n "$RELEASE_TOKEN" && test -n "$VERSION" && test -n "$PR" || exit 1
          printf '%s' "$PR" | grep -Eq '^[1-9][0-9]*$'
          printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'
          BRANCH="release/$PACKAGE-v$VERSION"
          IFS=$'\t' read -r STATE BASE HEAD MERGE <<EOF
          $(gh pr view "$PR" --json state,baseRefName,headRefName,mergeCommit --jq '[.state, .baseRefName, .headRefName, .mergeCommit.oid] | @tsv')
          EOF
          test "$STATE" = MERGED && test "$BASE" = main && test "$HEAD" = "$BRANCH"
          printf '%s' "$MERGE" | grep -Eq '^[0-9a-f]{40}$'
          git fetch origin main
          git show "origin/main:packages/$PACKAGE/package.json" > /tmp/current-package.json
          test "$(node -p "JSON.parse(require('node:fs').readFileSync('/tmp/current-package.json', 'utf8')).version")" = "$VERSION"
          git merge-base --is-ancestor "$MERGE" origin/main
          git checkout --detach "$MERGE"
          test "$(node -p "require('./packages/' + process.env.PACKAGE + '/package.json').version")" = "$VERSION"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run build
      - run: pnpm run lint
      - run: pnpm run test:coverage
      - run: pnpm run actionlint
      - name: Tag and publish merged release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          PACKAGE: ${{ inputs.package }}
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          test "$(node -p "require('./packages/' + process.env.PACKAGE + '/package.json').version")" = "$VERSION"
          TAG="$PACKAGE-v$VERSION"
          MERGE=$(git rev-parse HEAD)
          TAG_REF=$(git ls-remote origin "refs/tags/$TAG" | cut -f1)
          PEELED=$(git ls-remote origin "refs/tags/$TAG^{}" | cut -f1)
          PACKAGE_URL=$(node -p 'encodeURIComponent(process.env.PACKAGE)')
          STATUS=$(curl --fail-with-body --silent --show-error --output /tmp/npm-version.json --write-out '%{http_code}' "https://registry.npmjs.org/$PACKAGE_URL/$VERSION" || true)
          if test "$STATUS" = 200; then
            node scripts/verify-release-metadata.mts /tmp/npm-version.json "$VERSION" "$MERGE"
          elif test "$STATUS" = 404; then
            true
          else
            echo "npm registry lookup failed with HTTP $STATUS" >&2; exit 1
          fi
          if test -z "$TAG_REF"; then git tag -a "$TAG" -m "$TAG" && git push origin "$TAG"
          else test -n "$PEELED" && test "$PEELED" = "$MERGE" || exit 1; fi
          if test "$STATUS" = 404; then (cd "packages/$PACKAGE" && npm publish --access public); fi
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$PACKAGE v$VERSION" --generate-notes
