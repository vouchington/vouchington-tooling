name: Labeler

# pull_request, not pull_request_target (GitHub is retiring its default allowance). Fork PRs get a
# read-only token, so a failed labeling step never fails this required check.
on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7
        timeout-minutes: 1
        continue-on-error: true
