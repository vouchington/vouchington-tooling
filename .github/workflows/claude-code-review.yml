name: Claude Code Review

on:
  workflow_call:
    outputs:
      agent_outcome:
        description: Advisory Claude review-agent outcome.
        value: ${{ jobs.claude-review.outputs.agent_outcome }}
      payload_artifact_id:
        description: Review payload artifact ID when a payload was produced.
        value: ${{ jobs.claude-review.outputs.payload_artifact_id }}
      poster_outcome:
        description: Advisory Claude review-poster outcome.
        value: ${{ jobs.claude-review.outputs.poster_outcome }}
    inputs:
      pr_number:
        description: Pull request number to review
        required: true
        type: string
      expected_head_sha:
        required: false
        type: string
        default: ''
      expected_base_sha:
        required: false
        type: string
        default: ''
      tooling_ref:
        description: Immutable full SHA of vouchington/vouchington-tooling
        required: true
        type: string
      trusted_prompt_ref:
        required: false
        type: string
        default: ${{ github.sha }}
      prompt_path:
        required: false
        type: string
        default: .agents/skills/agent-workflow/code-review-prompt.md
      inline_prompt_path:
        required: false
        type: string
        default: docs/prompts/code-review-inline-comments.md
      extra_prompt:
        required: false
        type: string
        default: ''
      model:
        required: false
        type: string
        default: opus
      effort:
        required: false
        type: string
        default: xhigh
      runs_on:
        required: false
        type: string
        default: '["ubuntu-latest"]'
      required_review:
        required: false
        type: string
        default: 'false'
    secrets:
      claude_code_oauth_token:
        required: false
      provider_api_token:
        required: false
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to review
        required: true
        type: string
      expected_head_sha:
        description: Exact pull request head SHA that may be reviewed and posted
        required: false
        type: string
        default: ''
      expected_base_sha:
        description: Exact pull request base SHA that owns the trusted prompt
        required: false
        type: string
        default: ''
      model:
        description: Claude model to use
        required: false
        type: choice
        default: opus
        options:
          - haiku
          - sonnet
          - opus
      effort:
        description: Thinking effort level
        required: false
        type: choice
        default: xhigh
        options:
          - low
          - medium
          - high
          - xhigh
          - max
      required_review:
        description: Fail the workflow if the review cannot run
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-dispatch-${{ inputs.pr_number || github.sha }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  claude-review:
    permissions:
      actions: read
      contents: read
      pull-requests: write
      id-token: write
    uses: ./.github/workflows/code-review.yml
    with:
      pr_number: ${{ inputs.pr_number }}
      expected_head_sha: ${{ inputs.expected_head_sha }}
      expected_base_sha: ${{ inputs.expected_base_sha }}
      tooling_ref: ${{ inputs.tooling_ref || github.sha }}
      trusted_prompt_ref: ${{ inputs.trusted_prompt_ref || inputs.expected_base_sha || github.sha }}
      model: ${{ inputs.model }}
      effort: ${{ inputs.effort }}
      runs_on: ${{ inputs.runs_on || '["ubuntu-latest"]' }}
      required_review: ${{ (inputs.required_review == true || inputs.required_review == 'true') && 'true' || 'false' }}
      compatibility_warning: false
      prompt_path: ${{ inputs.prompt_path || '.agents/skills/agent-workflow/code-review-prompt.md' }}
      inline_prompt_path: ${{ inputs.inline_prompt_path || 'docs/prompts/code-review-inline-comments.md' }}
      extra_prompt: ${{ inputs.extra_prompt || '' }}
    secrets:
      claude_code_oauth_token: ${{ secrets.claude_code_oauth_token || secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      provider_api_token: ${{ secrets.provider_api_token }}
