name: Dependabot Auto-merge

on:
  pull_request_target:
    # `edited` lets the action disable stale auto-merge after a base-branch retarget.
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft, edited]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  automerge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      # Load the local action from the trusted default branch, never a retargeted PR base.
      - name: Check out trusted automation # nosemgrep
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}
      - name: Evaluate Dependabot update
        uses: ./.github/actions/dependabot-automerge
        with:
          automerge_token: ${{ secrets.DEPENDABOT_AUTOMERGE_TOKEN }}
