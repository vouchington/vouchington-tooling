name: Code Review

on:
  workflow_call:
    inputs:
      pr_number:
        description: Pull request number to review
        required: true
        type: string
      expected_head_sha:
        description: Exact pull request head SHA that may be reviewed and posted
        required: false
        type: string
        default: ''
      expected_base_sha:
        description: Exact pull request base SHA that owns the trusted prompt
        required: false
        type: string
        default: ''
      trusted_prompt_ref:
        description: Set explicitly to expected_base_sha whenever selected SHAs are provided
        required: false
        type: string
        default: ${{ github.sha }}
      prompt_path:
        required: false
        type: string
        default: .agents/skills/agent-workflow/code-review-prompt.md
      inline_prompt_path:
        required: false
        type: string
        default: docs/prompts/code-review-inline-comments.md
      extra_prompt:
        description: Extra prompt text. The action rejects this unless the caller is private.
        required: false
        type: string
        default: ''
      model:
        required: false
        type: string
        default: opus
      effort:
        required: false
        type: string
        default: xhigh
      runs_on:
        description: JSON array of runner labels
        required: false
        type: string
        default: '["ubuntu-latest"]'
      required_review:
        required: false
        type: boolean
        default: false
      token_source:
        required: false
        type: string
        default: claude-app
      provider_name:
        required: false
        type: string
        default: Claude
    secrets:
      claude_code_oauth_token:
        required: false
      provider_api_token:
        required: false
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to review
        required: true
        type: number
      expected_head_sha:
        description: Exact pull request head SHA that may be reviewed and posted
        required: false
        type: string
        default: ''
      expected_base_sha:
        description: Exact pull request base SHA that owns the trusted prompt
        required: false
        type: string
        default: ''
      trusted_prompt_ref:
        description: Set explicitly to expected_base_sha whenever selected SHAs are provided
        required: false
        type: string
        default: ''
      model:
        description: Claude model to use
        required: false
        type: choice
        default: opus
        options:
          - haiku
          - sonnet
          - opus
      effort:
        description: Thinking effort level
        required: false
        type: choice
        default: xhigh
        options:
          - low
          - medium
          - high
          - xhigh
          - max
      required_review:
        description: Fail the workflow if the review cannot run
        required: false
        type: boolean
        default: false

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  review:
    runs-on: ${{ fromJSON(inputs.runs_on || '["ubuntu-latest"]') }}
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      agent_outcome: ${{ steps.agent.outputs.agent_outcome }}
      payload_artifact_id: ${{ steps.agent.outputs.payload_artifact_id }}
    steps:
      - name: Validate selected pull request refs
        if: inputs.expected_head_sha != '' || inputs.expected_base_sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          EXPECTED_BASE_SHA: ${{ inputs.expected_base_sha }}
          TRUSTED_PROMPT_REF: ${{ inputs.trusted_prompt_ref || github.sha }}
        run: |
          set -euo pipefail
          sha_or_empty() { [[ -z "$1" || "$1" =~ ^[0-9a-f]{40}$ ]]; }
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]] || { echo '::error::pr_number must be a positive integer.'; exit 1; }
          sha_or_empty "$EXPECTED_HEAD_SHA" || { echo '::error::expected_head_sha must be a full lowercase commit SHA.'; exit 1; }
          sha_or_empty "$EXPECTED_BASE_SHA" || { echo '::error::expected_base_sha must be a full lowercase commit SHA.'; exit 1; }
          if { [ -n "$EXPECTED_HEAD_SHA" ] && [ -z "$EXPECTED_BASE_SHA" ]; } ||
             { [ -z "$EXPECTED_HEAD_SHA" ] && [ -n "$EXPECTED_BASE_SHA" ]; }; then
            echo '::error::expected_head_sha and expected_base_sha must be provided together.'
            exit 1
          fi
          pr_refs="$(gh api --method GET "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" \
            --jq '[.head.sha, .base.sha] | @tsv')"
          IFS=$'\t' read -r current_head current_base <<< "$pr_refs"
          if [ -n "$EXPECTED_HEAD_SHA" ] && [ "$current_head" != "$EXPECTED_HEAD_SHA" ]; then
            echo "::error::PR head changed from $EXPECTED_HEAD_SHA to $current_head before review."
            exit 1
          fi
          if [ -n "$EXPECTED_BASE_SHA" ] && [ "$current_base" != "$EXPECTED_BASE_SHA" ]; then
            echo "::error::PR base changed from $EXPECTED_BASE_SHA to $current_base before review."
            exit 1
          fi
          if [ -n "$EXPECTED_BASE_SHA" ] && [ "$TRUSTED_PROMPT_REF" != "$EXPECTED_BASE_SHA" ]; then
            echo '::error::trusted_prompt_ref must be explicitly set to expected_base_sha.'
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Checkout review actions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: vouchington/vouchington-tooling
          ref: ${{ github.workflow_sha }}
          path: .vouchington-tooling
          fetch-depth: 1

      - name: Run Code Review
        id: agent
        uses: ./.vouchington-tooling/.github/actions/code-review
        with:
          pr_number: ${{ inputs.pr_number }}
          provider_name: ${{ inputs.provider_name || 'Claude' }}
          trusted_prompt_ref: ${{ inputs.trusted_prompt_ref || github.sha }}
          prompt_path: ${{ inputs.prompt_path || '.agents/skills/agent-workflow/code-review-prompt.md' }}
          inline_prompt_path: ${{ inputs.inline_prompt_path || 'docs/prompts/code-review-inline-comments.md' }}
          extra_prompt: ${{ inputs.extra_prompt || '' }}
          model: ${{ inputs.model }}
          effort: ${{ inputs.effort }}
          claude_code_oauth_token: ${{ secrets.claude_code_oauth_token }}
          provider_api_token: ${{ secrets.provider_api_token }}

      - name: Require agent success
        if: >-
          always() &&
          (inputs.required_review == true || inputs.required_review == 'true') &&
          (steps.agent.outcome != 'success' || steps.agent.outputs.agent_outcome != 'success')
        run: |
          echo "::error::Code Review agent did not complete successfully."
          exit 1

  poster:
    needs: [review]
    if: always() && needs.review.outputs.payload_artifact_id != ''
    runs-on: ${{ fromJSON(inputs.runs_on || '["ubuntu-latest"]') }}
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: write
      id-token: write
    outputs:
      poster_outcome: ${{ steps.poster.outputs.poster_outcome }}
      posted: ${{ steps.poster.outputs.posted }}
    steps:
      - name: Checkout review actions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: vouchington/vouchington-tooling
          ref: ${{ github.workflow_sha }}
          path: .vouchington-tooling
          fetch-depth: 1

      - name: Post Code Review
        id: poster
        uses: ./.vouchington-tooling/.github/actions/code-review-poster
        with:
          pr_number: ${{ inputs.pr_number }}
          artifact_id: ${{ needs.review.outputs.payload_artifact_id }}
          provider_name: ${{ inputs.provider_name || 'Claude' }}
          token_source: ${{ inputs.token_source || 'claude-app' }}
          expected_head_sha: ${{ inputs.expected_head_sha }}
          expected_base_sha: ${{ inputs.expected_base_sha }}

      - name: Require poster success
        if: >-
          always() &&
          (inputs.required_review == true || inputs.required_review == 'true') &&
          (steps.poster.outcome != 'success' || steps.poster.outputs.poster_outcome != 'success')
        run: |
          echo "::error::Code Review poster did not complete successfully."
          exit 1
