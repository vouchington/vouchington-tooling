name: Request Final Code Review

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions: {}

concurrency:
  group: request-final-review-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  request:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      checks: read
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Route exact completed CI run
        uses: vouchington/vouchington-tooling/.github/actions/request-final-review@60c61e6f929913e4e06e30a2b80d7bf3addc0b63 # v0.3.5
        with:
          read-token: ${{ github.token }}
          write-token: ${{ github.token }}
          source-run-id: ${{ github.event.workflow_run.id }}
          source-run-attempt: ${{ github.event.workflow_run.run_attempt }}
          source-head-sha: ${{ github.event.workflow_run.head_sha }}
          source-head-repository: ${{ github.event.workflow_run.head_repository.full_name }}
          default-branch: ${{ github.event.repository.default_branch }}
          source-workflow-path: .github/workflows/ci.yml
          source-workflow-event: pull_request
          fan-in-job: tests
          requested-label: final-code-review:requested
          complete-label: final-code-review:complete
          review-workflow-path: .github/workflows/final-code-review.yml
          review-workflow-event: repository_dispatch
          review-check-name: Code Reviewed
          dispatch-event-type: final-review-requested
