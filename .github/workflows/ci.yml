name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    # knip's oxc-parser allocates a large ArrayBuffer; ubuntu-slim OOMs.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - id: pnpm-version
        uses: ./.github/actions/resolve-pnpm-version
      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          version: ${{ steps.pnpm-version.outputs.version }}
          install: false
          node-version-file: false
      - run: pnpm install --frozen-lockfile
      - name: Install scc
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          cache: false
        timeout-minutes: 3
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run build
      - run: pnpm run test:coverage
      - name: Stage coverage for trusted upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.0
        with:
          name: coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: coverage/lcov.info
          if-no-files-found: error
          retention-days: 1

  test-macos:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - id: pnpm-version
        uses: ./.github/actions/resolve-pnpm-version
      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          version: ${{ steps.pnpm-version.outputs.version }}
          install: false
          node-version-file: false
      - run: pnpm install --frozen-lockfile
      - name: Probe host-pressure-diagnostics.sh on real Darwin
        continue-on-error: true
        run: bash packages/vouchington-tooling/scripts/gha/host-pressure-diagnostics.sh
      - run: |
          pnpm exec vitest run --reporter=default --reporter=json \
            --outputFile="${{ runner.temp }}/vitest-report.json" \
            packages/vouchington-tooling/src/cli/commands/host-pressure-diagnostics.test.mts
      - name: Require the real-Darwin test to have actually run
        run: |
          bash packages/vouchington-tooling/scripts/gha/assert-vitest-test-passed.sh \
            "${{ runner.temp }}/vitest-report.json" \
            'ci/host-pressure-diagnostics.sh quantifies real Darwin load, cpu, and memory pressure without an empty section'

  coverage:
    needs: test
    if: needs.test.result == 'success'
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download coverage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.0
        with:
          name: coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: coverage
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          fail_ci_if_error: false
          files: ./coverage/lcov.info
          use_oidc: true

  actionlint:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - id: pnpm-version
        uses: ./.github/actions/resolve-pnpm-version
      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          version: ${{ steps.pnpm-version.outputs.version }}
          install: false
          node-version-file: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm run actionlint

  # Runs the composite action end to end so download-pnpm.mjs and install.mjs execute on real
  # runners. ubuntu-slim has what the action needs (bash, Node from actions/setup-node).
  setup-node-pnpm-smoke:
    name: setup-node-pnpm-smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-slim, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Resolved separately from the action's own resolution; both pick the same release unless
      # a pnpm 12 release crosses the 24-hour age cutoff between the two steps.
      - id: pnpm-version
        uses: ./.github/actions/resolve-pnpm-version
      - uses: ./.github/actions/setup-node-pnpm
      - name: Verify the downloaded pnpm
        env:
          EXPECTED_PNPM_VERSION: ${{ steps.pnpm-version.outputs.version }}
        run: |
          actual="$(pnpm --version)"
          location="$(command -v pnpm)"
          echo "pnpm $actual at $location"
          if [ "$actual" != "$EXPECTED_PNPM_VERSION" ]; then
            echo "::error::pnpm --version is $actual, expected $EXPECTED_PNPM_VERSION"
            exit 1
          fi
          case "$location" in
            "$RUNNER_TEMP"/*) ;;
            *)
              echo "::error::pnpm resolves to $location, expected a path under $RUNNER_TEMP"
              exit 1
              ;;
          esac

  tests:
    name: tests
    if: ${{ !cancelled() }}
    needs: [test, test-macos, actionlint]
    runs-on: ubuntu-slim
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Require all tests
        env:
          TEST_RESULT: ${{ needs.test.result }}
          TEST_MACOS_RESULT: ${{ needs.test-macos.result }}
          ACTIONLINT_RESULT: ${{ needs.actionlint.result }}
        run: |
          set -euo pipefail
          [ "$TEST_RESULT" = success ]
          [ "$TEST_MACOS_RESULT" = success ]
          [ "$ACTIONLINT_RESULT" = success ]
