name: CI request final code review

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

concurrency:
  group: >-
    ci-request-final-code-review-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

permissions: {}

jobs:
  request-final-code-review:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Request final code review for the tested ready head
        env:
          GH_TOKEN: ${{ secrets.CODE_REVIEW_TRIGGER_TOKEN }}
          PR_NUMBER: ''
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SOURCE_HEAD_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          TESTED_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          REQUESTED_LABEL: final-code-review:requested
          COMPLETE_LABEL: final-code-review:complete
          GH_RETRY_ATTEMPTS: '3'
          GH_RETRY_BACKOFF_SECONDS: '5'
        run: |
          set -euo pipefail
          [[ "$TESTED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo '::error::Invalid CI head SHA'; exit 1; }
          [ -n "${GH_TOKEN:-}" ] || { echo '::error::CODE_REVIEW_TRIGGER_TOKEN is required'; exit 1; }
          gh_retry() {
            local accepted="$1"; shift
            local attempt=1 status output
            while true; do
              status=0; output="$("$@" 2>&1)" || status=$?
              if [ "$status" -eq 0 ]; then GH_OUTPUT="$output"; return 0; fi
              if [ "$accepted" != none ] && grep -q "HTTP $accepted" <<< "$output"; then
                GH_OUTPUT=''; return 0
              fi
              if [ "$attempt" -ge "$GH_RETRY_ATTEMPTS" ] ||
                ! grep -Eq 'HTTP (403|429|5[0-9]{2})|TLS handshake timeout|unexpected EOF|i/o timeout' <<< "$output"; then
                printf '%s\n' "$output" >&2; return "$status"
              fi
              echo "::warning::GitHub API request failed; retrying attempt $((attempt + 1))/$GH_RETRY_ATTEMPTS."
              sleep "$((attempt * GH_RETRY_BACKOFF_SECONDS))"; attempt=$((attempt + 1))
            done
          }

          if [ -z "$PR_NUMBER" ]; then
            gh_retry none gh api "repos/$GITHUB_REPOSITORY/commits/$TESTED_HEAD_SHA/pulls"
            matches="$(jq -c --arg sha "$TESTED_HEAD_SHA" --arg repo "$GITHUB_REPOSITORY" --arg base "$DEFAULT_BRANCH" --arg head_repo "$SOURCE_HEAD_REPOSITORY" \
              '[.[] | select(.state == "open" and .head.sha == $sha and .head.repo.full_name == $head_repo and .base.repo.full_name == $repo and .base.ref == $base)]' \
              <<< "$GH_OUTPUT")"
            [ "$(jq 'length' <<< "$matches")" -eq 1 ] || {
              echo '::error::Could not resolve exactly one open pull request for the CI head.'; exit 1;
            }
            PR_NUMBER="$(jq -r '.[0].number' <<< "$matches")"
          fi

          gh_retry none gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER"
          pr_json="$GH_OUTPUT"
          [ "$(jq -r '.state' <<< "$pr_json")" = open ] || exit 0
          current_head_sha="$(jq -r '.head.sha' <<< "$pr_json")"
          is_draft="$(jq -r '.draft' <<< "$pr_json")"
          if [ "$is_draft" = true ]; then
            for label in "$REQUESTED_LABEL" "$COMPLETE_LABEL"; do
              encoded="$(jq -rn --arg value "$label" '$value | @uri')"
              gh_retry 404 gh api --method DELETE \
                "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/labels/$encoded" --silent
              echo "Cleared $label for draft PR #$PR_NUMBER."
            done
            echo "Skipping final code review because PR #$PR_NUMBER is a draft."
            exit 0
          fi
          if [ "$current_head_sha" != "$TESTED_HEAD_SHA" ]; then
            echo "Skipping stale CI result for $TESTED_HEAD_SHA; PR head is $current_head_sha."
            exit 0
          fi

          gh_retry none gh api --method GET \
            "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/jobs" \
            -f filter=all -f per_page=100 --paginate --slurp
          eligible="$(jq -r \
            '([.[].jobs[] | select(.name == "tests")] | sort_by(.run_attempt, .id) | last | .conclusion) == "success"' \
            <<< "$GH_OUTPUT")"
          if [ "$eligible" != true ]; then
            echo 'Skipping final review because the exact-head CI tests fan-in did not pass.'
            exit 0
          fi

          gh_retry none gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER"
          live_state="$GH_OUTPUT"
          [ "$(jq -r '.state' <<< "$live_state")" = open ] || exit 0
          [ "$(jq -r '.draft' <<< "$live_state")" = false ] || exit 0
          [ "$(jq -r '.head.sha' <<< "$live_state")" = "$TESTED_HEAD_SHA" ] || exit 0

          gh_retry none gh api --method GET \
            "repos/$GITHUB_REPOSITORY/commits/$TESTED_HEAD_SHA/check-runs" \
            -f filter=latest -f per_page=100 --paginate --slurp
          checks_json="$GH_OUTPUT"
          review_state=missing
          while IFS=$'\t' read -r status conclusion run_id; do
            [ -n "$run_id" ] || continue
            gh_retry none gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id"
            jq -e '.path == ".github/workflows/final-code-review.yml" and .event == "pull_request_target"' \
              <<< "$GH_OUTPUT" >/dev/null || continue
            if [ "$status" = completed ]; then review_state="$conclusion"; else review_state=active; fi
            break
          done < <(jq -r \
            '[.[].check_runs[] | select(.name == "Code Reviewed" and .app.slug == "github-actions")] |
             sort_by(.id) | reverse[] | [.status, (.conclusion // "none"), (try (.details_url | capture("/actions/runs/(?<id>[0-9]+)/").id) catch "")] | @tsv' \
            <<< "$checks_json")
          case "$review_state" in active|success) echo "Skipping duplicate final review ($review_state)."; exit 0;; esac

          encoded_complete="$(jq -rn --arg value "$COMPLETE_LABEL" '$value | @uri')"
          gh_retry 404 gh api --method DELETE \
            "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/labels/$encoded_complete" --silent

          encoded="$(jq -rn --arg value "$REQUESTED_LABEL" '$value | @uri')"
          gh_retry 404 gh api --method DELETE \
            "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/labels/$encoded" --silent
          gh_retry none gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER"
          final_state="$GH_OUTPUT"
          [ "$(jq -r '.state' <<< "$final_state")" = open ] || exit 0
          [ "$(jq -r '.draft' <<< "$final_state")" = false ] || {
            echo 'Skipping final code review because the PR became a draft before label creation.'; exit 0;
          }
          [ "$(jq -r '.head.sha' <<< "$final_state")" = "$TESTED_HEAD_SHA" ] || {
            echo 'Skipping final code review because the PR head changed before label creation.'; exit 0;
          }
          gh_retry none gh api --method POST \
            "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/labels" \
            -f "labels[]=$REQUESTED_LABEL" --silent
