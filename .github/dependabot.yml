version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 7
      exclude:
        - pr-shepherd
    open-pull-requests-limit: 5
    groups:
      oxc:
        applies-to: version-updates
        patterns:
          - oxfmt
          - oxlint
          - oxlint-tsgolint
      oxc-security:
        applies-to: security-updates
        patterns:
          - oxfmt
          - oxlint
          - oxlint-tsgolint
      vitest:
        applies-to: version-updates
        patterns:
          - vitest
          - '@vitest/*'
      vitest-security:
        applies-to: security-updates
        patterns:
          - vitest
          - '@vitest/*'
      csv:
        applies-to: version-updates
        patterns:
          - 'csv-*'
      csv-security:
        applies-to: security-updates
        patterns:
          - 'csv-*'
      picomatch:
        applies-to: version-updates
        patterns:
          - picomatch
          - '@types/picomatch'
      picomatch-security:
        applies-to: security-updates
        patterns:
          - picomatch
          - '@types/picomatch'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      artifact-actions:
        applies-to: version-updates
        patterns:
          - actions/download-artifact
          - actions/upload-artifact
      artifact-actions-security:
        applies-to: security-updates
        patterns:
          - actions/download-artifact
          - actions/upload-artifact
