name: Final review native gate
description: >
  Validate advisory provider outcomes, add final-code-review:complete, and
  fail closed on orchestration errors. Provider failures stay warnings.
  The caller job must grant issues: write and pull-requests: write.
  issues: write alone 403s PR labels (jonathanong/filaments run 33269571876).
inputs:
  gate_status:
    description: Native gate status from the selector composite
    required: true
  token:
    description: GitHub token used for live PR validation, labels, and selected-head check publication.
    required: true
  pr_number:
    description: Selected pull request number.
    required: true
  selected_head_sha:
    description: Selected exact pull request head SHA.
    required: true
  selected_base_sha:
    description: Selected exact pull request base SHA.
    required: true
  default_branch:
    description: Repository default branch.
    required: true
  complete_label:
    description: Completion label added after a successful trusted review.
    required: true
  check_name:
    description: Optional required check-run name to publish on the selected pull-request head.
    required: false
    default: ''
  requested_label:
    description: Optional pending-review label removed after a successful terminal gate.
    required: false
    default: ''
  provider_results_json:
    description: JSON array of advisory provider {name, outcome} results
    required: false
outputs:
  gate_outcome:
    description: Outcome of the advisory validation step
    value: ${{ steps.gate.outcome }}
  mark_outcome:
    description: Outcome of the completion-label step
    value: ${{ steps.mark-complete.outcome }}
  cleanup_outcome:
    description: Outcome of the pending-label cleanup step
    value: ${{ steps.clear-requested.outcome }}

runs:
  using: composite
  steps:
    - name: Validate final review outcome
      id: gate
      continue-on-error: true
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        PR_NUMBER: ${{ inputs.pr_number }}
        SELECTED_HEAD_SHA: ${{ inputs.selected_head_sha }}
        SELECTED_BASE_SHA: ${{ inputs.selected_base_sha }}
        DEFAULT_BRANCH: ${{ inputs.default_branch }}
        PROVIDER_RESULTS_JSON: ${{ inputs.provider_results_json }}
      run: bash "${GITHUB_ACTION_PATH}/gate.sh"
    - name: Mark final review complete
      id: mark-complete
      if: >-
        ${{ steps.gate.outcome == 'success' &&
        (inputs.gate_status == 'review' || inputs.gate_status == 'untrusted') }}
      continue-on-error: true
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        PR_NUMBER: ${{ inputs.pr_number }}
        SELECTED_HEAD_SHA: ${{ inputs.selected_head_sha }}
        SELECTED_BASE_SHA: ${{ inputs.selected_base_sha }}
        DEFAULT_BRANCH: ${{ inputs.default_branch }}
        GATE_STATUS: ${{ inputs.gate_status }}
        COMPLETE_LABEL: ${{ inputs.complete_label }}
      run: bash "${GITHUB_ACTION_PATH}/mark-complete.sh"
    - name: Clear pending final-review state
      id: clear-requested
      if: ${{ always() && inputs.requested_label != '' }}
      continue-on-error: true
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        PR_NUMBER: ${{ inputs.pr_number }}
        SELECTED_HEAD_SHA: ${{ inputs.selected_head_sha }}
        REQUESTED_LABEL: ${{ inputs.requested_label }}
      run: bash "${GITHUB_ACTION_PATH}/clear-requested.sh"
    - name: Publish selected-head check
      id: publish-check
      if: ${{ always() && inputs.check_name != '' }}
      continue-on-error: true
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        SELECTED_HEAD_SHA: ${{ inputs.selected_head_sha }}
        CHECK_NAME: ${{ inputs.check_name }}
        GATE_OUTCOME: ${{ steps.gate.outcome }}
        MARK_OUTCOME: ${{ steps.mark-complete.outcome }}
        CLEANUP_OUTCOME: ${{ steps.clear-requested.outcome }}
        REQUESTED_LABEL: ${{ inputs.requested_label }}
      run: bash "${GITHUB_ACTION_PATH}/publish-check.sh"
    - name: Require native gate outcome
      if: always()
      shell: bash
      env:
        GATE_OUTCOME: ${{ steps.gate.outcome }}
        MARK_OUTCOME: ${{ steps.mark-complete.outcome }}
        CLEANUP_OUTCOME: ${{ steps.clear-requested.outcome }}
        REQUESTED_LABEL: ${{ inputs.requested_label }}
        CHECK_NAME: ${{ inputs.check_name }}
        CHECK_OUTCOME: ${{ steps.publish-check.outcome }}
        CHECK_CONCLUSION: ${{ steps.publish-check.outputs.conclusion }}
      run: bash "${GITHUB_ACTION_PATH}/require.sh"
