name: Final review native gate
description: >
  Validate advisory provider outcomes, add final-code-review:complete, and
  fail closed on orchestration errors. Provider failures stay warnings.
  The caller job must grant issues: write and pull-requests: write.
  issues: write alone 403s PR labels (jonathanong/filaments run 33269571876).
inputs:
  gate_status:
    description: Native gate status from the selector composite
    required: true
  check_name:
    description: Optional required check-run name to publish on the selected pull-request head.
    required: false
    default: ''
  requested_label:
    description: Optional pending-review label removed after a successful terminal gate.
    required: false
    default: ''
outputs:
  gate_outcome:
    description: Outcome of the advisory validation step
    value: ${{ steps.gate.outcome }}
  mark_outcome:
    description: Outcome of the completion-label step
    value: ${{ steps.mark-complete.outcome }}

runs:
  using: composite
  steps:
    - name: Validate final review outcome
      id: gate
      continue-on-error: true
      shell: bash
      run: bash "${GITHUB_ACTION_PATH}/gate.sh"
    - name: Mark final review complete
      id: mark-complete
      if: >-
        ${{ steps.gate.outcome == 'success' &&
        (inputs.gate_status == 'review' || inputs.gate_status == 'untrusted') }}
      continue-on-error: true
      shell: bash
      env:
        GATE_STATUS: ${{ inputs.gate_status }}
        REQUESTED_LABEL: ${{ inputs.requested_label }}
      run: bash "${GITHUB_ACTION_PATH}/mark-complete.sh"
    - name: Publish selected-head check
      id: publish-check
      if: ${{ always() && inputs.check_name != '' }}
      continue-on-error: true
      shell: bash
      env:
        CHECK_NAME: ${{ inputs.check_name }}
        GATE_OUTCOME: ${{ steps.gate.outcome }}
        MARK_OUTCOME: ${{ steps.mark-complete.outcome }}
      run: bash "${GITHUB_ACTION_PATH}/publish-check.sh"
    - name: Require native gate outcome
      if: always()
      shell: bash
      env:
        GATE_OUTCOME: ${{ steps.gate.outcome }}
        MARK_OUTCOME: ${{ steps.mark-complete.outcome }}
        CHECK_NAME: ${{ inputs.check_name }}
        CHECK_OUTCOME: ${{ steps.publish-check.outcome }}
        CHECK_CONCLUSION: ${{ steps.publish-check.outputs.conclusion }}
      run: bash "${GITHUB_ACTION_PATH}/require.sh"
