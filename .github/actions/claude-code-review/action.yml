name: Claude Code Review
description: Run an explicitly selected Claude-compatible pull request review.

inputs:
  pr_number:
    description: Pull request number to review
    required: true
  provider_name:
    description: Provider name to show in workflow steps
    required: false
    default: Claude
  model:
    description: Claude-compatible model to use
    required: false
    default: ''
  effort:
    description: Thinking effort level
    required: false
    default: ''
  prompt_path:
    description: Relative path to the trusted review prompt file
    required: false
    default: .agents/skills/agent-workflow/code-review-prompt.md
  inline_prompt_path:
    description: Relative path to the trusted inline-comment overlay prompt
    required: false
    default: docs/prompts/code-review-inline-comments.md
  extra_prompt:
    description: Extra prompt text; rejected unless the calling repository is private
    required: false
    default: ''
  anthropic_base_url:
    description: Anthropic-compatible API base URL
    required: false
    default: ''
  anthropic_model:
    description: Default Claude Code model environment override
    required: false
    default: ''
  anthropic_default_opus_model:
    description: Default opus model environment override
    required: false
    default: ''
  anthropic_default_sonnet_model:
    description: Default sonnet model environment override
    required: false
    default: ''
  anthropic_default_haiku_model:
    description: Default haiku model environment override
    required: false
    default: ''
  claude_code_subagent_model:
    description: Default Claude Code subagent model
    required: false
    default: ''
  claude_code_effort_level:
    description: Default Claude Code effort level
    required: false
    default: ''
  claude_code_oauth_token:
    description: Claude Code OAuth token
    required: false
    default: ''
  provider_api_token:
    description: Anthropic-compatible provider API token
    required: false
    default: ''
  trusted_prompt_ref:
    description: Trusted git ref to read the review prompt from
    required: true

outputs:
  agent_outcome:
    description: Aggregate agent and payload-transport outcome
    value: ${{ steps.review.outputs.agent_outcome }}
  payload_artifact_id:
    description: Uploaded review payload artifact ID
    value: ${{ steps.review.outputs.payload_artifact_id }}

runs:
  using: composite
  steps:
    - name: Run Claude Code Review
      id: review
      uses: ./.github/actions/code-review
      with:
        compatibility_warning: 'false'
        pr_number: ${{ inputs.pr_number }}
        provider_name: ${{ inputs.provider_name }}
        model: ${{ inputs.model }}
        effort: ${{ inputs.effort }}
        prompt_path: ${{ inputs.prompt_path }}
        inline_prompt_path: ${{ inputs.inline_prompt_path }}
        extra_prompt: ${{ inputs.extra_prompt }}
        anthropic_base_url: ${{ inputs.anthropic_base_url }}
        anthropic_model: ${{ inputs.anthropic_model }}
        anthropic_default_opus_model: ${{ inputs.anthropic_default_opus_model }}
        anthropic_default_sonnet_model: ${{ inputs.anthropic_default_sonnet_model }}
        anthropic_default_haiku_model: ${{ inputs.anthropic_default_haiku_model }}
        claude_code_subagent_model: ${{ inputs.claude_code_subagent_model }}
        claude_code_effort_level: ${{ inputs.claude_code_effort_level }}
        claude_code_oauth_token: ${{ inputs.claude_code_oauth_token }}
        provider_api_token: ${{ inputs.provider_api_token }}
        trusted_prompt_ref: ${{ inputs.trusted_prompt_ref }}
