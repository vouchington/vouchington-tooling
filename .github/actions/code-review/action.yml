name: Code Review
description: Run a Claude-compatible pull request code review with a file-built prompt.
outputs:
  agent_outcome:
    description: Aggregate agent and payload-transport outcome
    value: ${{ steps.agent-result.outputs.agent_outcome }}
  payload_artifact_id:
    description: Uploaded review payload artifact ID, empty when no payload was produced
    value: ${{ steps.upload-payload.outputs.artifact-id }}

inputs:
  pr_number:
    description: Pull request number to review
    required: true
  provider_name:
    description: Provider name to show in workflow steps
    required: false
    default: Claude
  model:
    description: Claude-compatible model to use (haiku, sonnet, or opus)
    required: false
    default: ''
  effort:
    description: Thinking effort level (low, medium, high, xhigh, or max)
    required: false
    default: ''
  prompt_path:
    description: Relative path to the trusted review prompt file
    required: false
    default: .agents/skills/agent-workflow/code-review-prompt.md
  inline_prompt_path:
    description: Relative path to the trusted inline-comment overlay prompt
    required: false
    default: docs/prompts/code-review-inline-comments.md
  extra_prompt:
    description: Extra prompt text. Rejected unless the calling repository is private.
    required: false
    default: ''
  anthropic_base_url:
    description: Anthropic-compatible API base URL
    required: false
    default: ''
  anthropic_model:
    description: Default Claude Code model environment override
    required: false
    default: ''
  anthropic_default_opus_model:
    description: Default opus model environment override
    required: false
    default: ''
  anthropic_default_sonnet_model:
    description: Default sonnet model environment override
    required: false
    default: ''
  anthropic_default_haiku_model:
    description: Default haiku model environment override
    required: false
    default: ''
  claude_code_subagent_model:
    description: Default Claude Code subagent model
    required: false
    default: ''
  claude_code_effort_level:
    description: Default Claude Code effort level
    required: false
    default: ''
  claude_code_oauth_token:
    description: Claude Code OAuth token
    required: false
    default: ''
  provider_api_token:
    description: Anthropic-compatible provider API token
    required: false
    default: ''
  trusted_prompt_ref:
    description: Trusted git ref to read the review prompt from
    required: true

runs:
  using: composite
  steps:
    - name: Stash existing trusted prompt directory
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/stash-trusted-prompt-dir.sh"

    - name: Checkout trusted review prompt
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ inputs.trusted_prompt_ref }}
        path: .trusted-review-prompt
        fetch-depth: 1

    - name: Build review prompt
      id: review-prompt
      shell: bash
      env:
        REVIEW_TARGET: ${{ github.repository }}#${{ inputs.pr_number }}
        PROMPT_PATH: ${{ inputs.prompt_path }}
        INLINE_PROMPT_PATH: ${{ inputs.inline_prompt_path }}
        EXTRA_PROMPT: ${{ inputs.extra_prompt }}
        REPO_PRIVATE: ${{ github.event.repository.private }}
        MODEL: ${{ inputs.model }}
        EFFORT: ${{ inputs.effort }}
      run: |
        set -euo pipefail
        case "${MODEL:-}" in
          ''|haiku|sonnet|opus) ;;
          *) echo "::error::model must be haiku, sonnet, opus, or empty."; exit 1 ;;
        esac
        case "${EFFORT:-}" in
          ''|low|medium|high|xhigh|max) ;;
          *) echo "::error::effort must be low, medium, high, xhigh, max, or empty."; exit 1 ;;
        esac
        if [ -n "$EXTRA_PROMPT" ] && [ "$REPO_PRIVATE" != "true" ]; then
          echo "::error::extra_prompt is only allowed in private repositories."
          exit 1
        fi
        prompt_rel="$(bash "$GITHUB_ACTION_PATH/validate-prompt-path.sh" "$PROMPT_PATH")"
        inline_rel="$(bash "$GITHUB_ACTION_PATH/validate-prompt-path.sh" "$INLINE_PROMPT_PATH")"
        trusted_root="${GITHUB_WORKSPACE}/.trusted-review-prompt"
        trusted_prompt="$trusted_root/$prompt_rel"
        trusted_inline_prompt="$trusted_root/$inline_rel"
        prompt_file="${RUNNER_TEMP}/code-review-prompt.md"
        if [ ! -f "$trusted_prompt" ]; then
          echo "::notice::Trusted review prompt is not present on the trusted ref; skipping code review."
          echo "available=false" >> "$GITHUB_OUTPUT"
          rm -rf "$trusted_root"
          exit 0
        fi
        if [ -f "$trusted_inline_prompt" ]; then
          has_inline=true
        else
          echo "::notice::Inline comment overlay prompt is not present on the trusted ref; proceeding without it."
          has_inline=false
        fi
        {
          printf 'Target: %s\n\n' "$REVIEW_TARGET"
          cat "$trusted_prompt"
          if [ "$has_inline" = true ]; then
            echo
            cat "$trusted_inline_prompt"
          fi
          if [ -n "$EXTRA_PROMPT" ]; then
            printf '\n%s\n' "$EXTRA_PROMPT"
          fi
        } >"$prompt_file"
        {
          echo 'available=true'
          echo 'prompt<<REVIEW_PROMPT_EOF'
          cat "$prompt_file"
          echo
          echo 'REVIEW_PROMPT_EOF'
        } >> "$GITHUB_OUTPUT"
        rm -rf "$trusted_root"

    - name: Stage trusted action runtime
      id: runtime
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/stage-runtime.sh"

    - name: Clear leftover review payload
      shell: bash
      run: |
        set -euo pipefail
        rm -f "${GITHUB_WORKSPACE}/code-review-payload.json"
        rm -rf "${GITHUB_WORKSPACE}/.vouchington-tooling"

    - name: Isolate Claude Code install home
      if: steps.review-prompt.outputs.available == 'true'
      id: claude-home
      shell: bash
      run: |
        set -euo pipefail
        runner_name="${RUNNER_NAME:-default}"
        home="$HOME/.claude-code-action-home/${runner_name//[^A-Za-z0-9._-]/_}"
        mkdir -p "$home/.claude"
        hook="$home/.claude/worktree-create.sh"
        cp "${VOUCHINGTON_ACTION_PATH:?}/worktree-create.sh" "$hook"
        chmod 700 "$hook"
        hook_json="${hook//\\/\\\\}"
        hook_json="${hook_json//\"/\\\"}"
        printf '%s\n' "{\"worktree\":{\"baseRef\":\"head\"},\"hooks\":{\"WorktreeCreate\":[{\"hooks\":[{\"type\":\"command\",\"command\":\"${hook_json}\"}]}]}}" > "$home/.claude/settings.json"
        echo "home=$home" >> "$GITHUB_OUTPUT"

    - name: Resolve trusted Node version
      id: trusted-node-version
      if: always() && steps.review-prompt.outputs.available == 'true'
      continue-on-error: true
      shell: bash
      run: bash "${VOUCHINGTON_ACTION_PATH:?}/resolve-node-version.sh"

    - name: Setup trusted Node for payload handoff
      id: setup-node
      if: >-
        always() &&
        steps.review-prompt.outputs.available == 'true' &&
        steps.trusted-node-version.outcome == 'success'
      continue-on-error: true
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version: ${{ steps.trusted-node-version.outputs.version }}
        package-manager-cache: false

    - name: Run Code Review
      if: >-
        always() &&
        steps.review-prompt.outputs.available == 'true' &&
        steps.trusted-node-version.outcome == 'success' &&
        steps.setup-node.outcome == 'success'
      id: claude-review
      continue-on-error: true
      uses: anthropics/claude-code-action@9c5ddab2e6d17b83ea679153b31f1d5f023cf636 # v1.0.217
      env:
        HOME: ${{ steps.claude-home.outputs.home }}
        ANTHROPIC_AUTH_TOKEN: ${{ inputs.provider_api_token }}
        ANTHROPIC_BASE_URL: ${{ inputs.anthropic_base_url }}
        ANTHROPIC_MODEL: ${{ inputs.anthropic_model }}
        ANTHROPIC_DEFAULT_OPUS_MODEL: ${{ inputs.anthropic_default_opus_model }}
        ANTHROPIC_DEFAULT_SONNET_MODEL: ${{ inputs.anthropic_default_sonnet_model }}
        ANTHROPIC_DEFAULT_HAIKU_MODEL: ${{ inputs.anthropic_default_haiku_model }}
        CLAUDE_CODE_SUBAGENT_MODEL: ${{ inputs.claude_code_subagent_model }}
        CLAUDE_CODE_EFFORT_LEVEL: ${{ inputs.claude_code_effort_level }}
      with:
        claude_code_oauth_token: ${{ inputs.claude_code_oauth_token }}
        anthropic_api_key: ${{ inputs.provider_api_token }}
        include_fix_links: false
        display_report: true
        use_sticky_comment: false
        track_progress: false
        show_full_output: true
        additional_permissions: |
          actions: read
        github_token: ${{ github.token }}
        allowed_bots: github-actions
        classify_inline_comments: 'false'
        claude_args: |
          --disallowedTools Bash
          --permission-mode acceptEdits
          --model ${{ inputs.model || 'opus' }}
          --effort ${{ inputs.effort || 'xhigh' }}
        prompt: ${{ steps.review-prompt.outputs.prompt }}

    - name: Stage review payload artifact
      id: stage-payload
      if: >-
        always() &&
        steps.review-prompt.outputs.available == 'true' &&
        steps.trusted-node-version.outcome == 'success' &&
        steps.setup-node.outcome == 'success'
      continue-on-error: true
      shell: bash
      env:
        SOURCE: ${{ github.workspace }}/code-review-payload.json
        DESTINATION: ${{ runner.temp }}/code-review-payload
      run: |
        set -euo pipefail
        node --experimental-strip-types \
          "${VOUCHINGTON_TOOLING_ROOT:?}/packages/vouchington-tooling/src/gha-review-payload/cli.mts" \
          optional "$SOURCE" "$DESTINATION"

    - name: Upload review payload
      id: upload-payload
      if: always() && steps.stage-payload.outcome == 'success' && steps.stage-payload.outputs.staged == 'true'
      continue-on-error: true
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: code-review-payload
        path: ${{ runner.temp }}/code-review-payload/code-review-payload.json
        if-no-files-found: error
        overwrite: true
        retention-days: 1

    - name: Record agent outcome
      id: agent-result
      if: always()
      shell: bash
      env:
        PROMPT_AVAILABLE: ${{ steps.review-prompt.outputs.available }}
        VERSION_OUTCOME: ${{ steps.trusted-node-version.outcome }}
        SETUP_OUTCOME: ${{ steps.setup-node.outcome }}
        REVIEW_OUTCOME: ${{ steps.claude-review.outcome }}
        STAGE_OUTCOME: ${{ steps.stage-payload.outcome }}
        PAYLOAD_STAGED: ${{ steps.stage-payload.outputs.staged }}
        UPLOAD_OUTCOME: ${{ steps.upload-payload.outcome }}
        ARTIFACT_ID: ${{ steps.upload-payload.outputs.artifact-id }}
        PROVIDER_NAME: ${{ inputs.provider_name }}
      run: |
        set -euo pipefail
        outcome=failure
        if [ "$PROMPT_AVAILABLE" = "true" ] && \
          [ "$VERSION_OUTCOME" = "success" ] && \
          [ "$SETUP_OUTCOME" = "success" ] && \
          [ "$REVIEW_OUTCOME" = "success" ] && \
          [ "$STAGE_OUTCOME" = "success" ]; then
          if [ "$PAYLOAD_STAGED" != "true" ] || [ "$UPLOAD_OUTCOME" = "success" ]; then
            outcome=success
          fi
        fi
        echo "agent_outcome=$outcome" >> "$GITHUB_OUTPUT"
        if [ "$outcome" != "success" ] && [ -z "$ARTIFACT_ID" ]; then
          echo "::warning::$PROVIDER_NAME Code Review did not complete; no review payload was uploaded."
          echo "⚠️ $PROVIDER_NAME Code Review did not complete; no review payload was uploaded." >> "$GITHUB_STEP_SUMMARY"
        fi

    - name: Clean review payload files
      if: always()
      shell: bash
      run: |
        set -euo pipefail
        bash "${VOUCHINGTON_ACTION_PATH:?}/cleanup-worktrees.sh"
        bash "${VOUCHINGTON_ACTION_PATH:?}/restore-trusted-prompt-dir.sh"
        rm -rf \
          "${GITHUB_WORKSPACE}/code-review-payload.json" \
          "${GITHUB_WORKSPACE}/.vouchington-tooling" \
          "${RUNNER_TEMP}/code-review-payload" \
          "${RUNNER_TEMP}/code-review-prompt.md" \
          "${RUNNER_TEMP}/vouchington-tooling-runtime"
