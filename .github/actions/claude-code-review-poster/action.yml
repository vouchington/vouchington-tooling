name: Claude Code Review Poster
description: Post a validated review payload with the explicitly selected Claude App OIDC adapter.

inputs:
  pr_number:
    description: Pull request number to review
    required: true
  artifact_id:
    description: Same-run review payload artifact ID
    required: true
  provider_name:
    description: Provider name to show in workflow diagnostics
    required: false
    default: Claude
  expected_head_sha:
    description: Exact pull request head SHA that may receive the review
    required: false
    default: ''
  expected_base_sha:
    description: Exact pull request base SHA required when the review is posted
    required: false
    default: ''

outputs:
  poster_outcome:
    description: Aggregate download, validation, and posting outcome
    value: ${{ steps.poster.outputs.poster_outcome }}
  posted:
    description: Whether a review was posted
    value: ${{ steps.poster.outputs.posted }}

runs:
  using: composite
  steps:
    - name: Post review with Claude App token
      id: poster
      uses: $/.github/actions/code-review-poster
      with:
        compatibility_warning: 'false'
        pr_number: ${{ inputs.pr_number }}
        artifact_id: ${{ inputs.artifact_id }}
        provider_name: ${{ inputs.provider_name }}
        token_source: claude-app
        expected_head_sha: ${{ inputs.expected_head_sha }}
        expected_base_sha: ${{ inputs.expected_base_sha }}
