name: OpenCode Code Review
description: Run an OpenCode pull request code review with a pinned CLI and file-built prompt.
outputs:
  agent_outcome:
    description: Aggregate agent and payload-transport outcome. One of success, skipped, failure.
    value: ${{ steps.agent-result.outputs.agent_outcome }}
  payload_artifact_id:
    description: Uploaded review payload artifact ID, empty when no payload was produced
    value: ${{ steps.upload-payload.outputs.artifact-id }}

inputs:
  pr_number:
    description: Pull request number to review
    required: true
  provider_name:
    description: Provider name to show in workflow steps
    required: false
    default: OpenCode
  model:
    description: OpenCode model id in provider/model form
    required: true
  timeout_seconds:
    description: Maximum OpenCode runtime in seconds (1-3600), plus a fixed 30-second termination grace; reserves job time for payload handoff and cleanup
    required: false
    default: '1200'
  payload_artifact_name:
    description: Unique suffix for the code-review-payload-* artifact
    required: true
  openrouter_api_key:
    description: OpenRouter API key; injects OPENROUTER_API_KEY when non-empty
    required: false
    default: ''
  opencode_api_key:
    description: OpenCode Zen API key; injects OPENCODE_API_KEY when non-empty
    required: false
    default: ''
  prompt_path:
    description: Relative path to the trusted review prompt file
    required: false
    default: .agents/skills/agent-workflow/code-review-prompt.md
  inline_prompt_path:
    description: Relative path to the trusted inline-comment overlay prompt
    required: false
    default: docs/prompts/code-review-inline-comments.md
  extra_prompt:
    description: Extra prompt text. Ignored with a notice unless the calling repository is private.
    required: false
    default: ''
  trusted_prompt_ref:
    description: Trusted git ref to read the review prompt from
    required: true

runs:
  using: composite
  steps:
    - name: Stash existing trusted prompt directory
      shell: bash
      continue-on-error: true
      run: |
        bash "$GITHUB_ACTION_PATH/../code-review/stash-trusted-prompt-dir.sh" || \
          echo '::notice::Could not stash an existing .trusted-review-prompt directory; continuing.'

    - name: Checkout trusted review prompt
      continue-on-error: true
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ inputs.trusted_prompt_ref }}
        path: .trusted-review-prompt
        fetch-depth: 1
        persist-credentials: false

    - name: Build review prompt
      id: review-prompt
      shell: bash
      continue-on-error: true
      env:
        REVIEW_TARGET: ${{ github.repository }}#${{ inputs.pr_number }}
        PROMPT_PATH: ${{ inputs.prompt_path }}
        INLINE_PROMPT_PATH: ${{ inputs.inline_prompt_path }}
        EXTRA_PROMPT: ${{ inputs.extra_prompt }}
        REPO_PRIVATE: ${{ github.event.repository.private }}
      run: bash "$GITHUB_ACTION_PATH/build-prompt.sh"

    - name: Clear leftover review payload
      if: steps.review-prompt.outputs.available == 'true'
      continue-on-error: true
      shell: bash
      run: |
        set -euo pipefail
        rm -f "${GITHUB_WORKSPACE}/code-review-payload.json"
        rm -rf "${GITHUB_WORKSPACE}/.review-context"

    - name: Isolate OpenCode install home
      if: steps.review-prompt.outputs.available == 'true'
      id: opencode-home
      continue-on-error: true
      shell: bash
      run: |
        set -euo pipefail
        home="${RUNNER_TEMP}/opencode-home"
        mkdir -p "$home"
        echo "home=$home" >> "$GITHUB_OUTPUT"

    - name: Materialize PR review context
      id: materialize
      if: steps.review-prompt.outputs.available == 'true'
      continue-on-error: true
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ inputs.pr_number }}
      run: |
        set -euo pipefail
        bash "$GITHUB_ACTION_PATH/../../../packages/vouchington-tooling/scripts/gha/materialize-pr-context.sh"

    - name: Install pinned OpenCode CLI
      id: install-opencode
      if: steps.review-prompt.outputs.available == 'true'
      continue-on-error: true
      shell: bash
      env:
        # renovate: datasource=github-releases depName=anomalyco/opencode extractVersion=^v(?<version>.*)$
        OPENCODE_VERSION: '1.18.29'
        OPENCODE_HOME: ${{ steps.opencode-home.outputs.home }}
      run: bash "$GITHUB_ACTION_PATH/install-opencode-cli.sh"

    - name: Resolve trusted Node version
      id: trusted-node-version
      if: always() && steps.review-prompt.outputs.available == 'true'
      continue-on-error: true
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/../code-review/resolve-node-version.sh"

    - name: Setup trusted Node for payload handoff
      id: setup-node
      if: >-
        always() &&
        steps.review-prompt.outputs.available == 'true' &&
        steps.trusted-node-version.outcome == 'success'
      continue-on-error: true
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ steps.trusted-node-version.outputs.version }}
        package-manager-cache: false

    - name: Run OpenCode Review
      if: >-
        always() &&
        steps.review-prompt.outputs.available == 'true' &&
        steps.materialize.outcome == 'success' &&
        steps.install-opencode.outcome == 'success' &&
        steps.trusted-node-version.outcome == 'success' &&
        steps.setup-node.outcome == 'success'
      id: opencode-review
      continue-on-error: true
      shell: bash
      env:
        HOME: ${{ steps.opencode-home.outputs.home }}
        OPENCODE_BIN: ${{ steps.install-opencode.outputs.bin }}
        OPENROUTER_API_KEY: ${{ inputs.openrouter_api_key }}
        OPENCODE_API_KEY: ${{ inputs.opencode_api_key }}
        OPENCODE_DISABLE_AUTOUPDATE: '1'
        OPENCODE_AUTO_SHARE: '0'
        GH_TOKEN: ''
        GITHUB_TOKEN: ''
        OPENCODE_MODEL: ${{ inputs.model }}
        OPENCODE_PROMPT_PATH: ${{ steps.review-prompt.outputs.prompt_path }}
        TIMEOUT_SECONDS: ${{ inputs.timeout_seconds }}
        OPENCODE_PERMISSION: >-
          {"bash":"deny","webfetch":"deny","websearch":"deny","task":"deny","skill":"deny","read":"allow","glob":"allow","grep":"allow","list":"allow","external_directory":"deny","edit":{"*":"deny","code-review-payload.json":"allow"}}
      run: |
        set -euo pipefail
        if [ -z "$OPENCODE_MODEL" ]; then
          echo '::notice::OpenCode review skipped: no model configured.'
          echo 'skipped=true' >> "$GITHUB_OUTPUT"
          exit 0
        fi
        if [ -z "${OPENROUTER_API_KEY}" ] && [ -z "${OPENCODE_API_KEY}" ]; then
          echo '::notice::OpenCode review skipped: no provider API key configured.'
          echo 'skipped=true' >> "$GITHUB_OUTPUT"
          exit 0
        fi
        case "$TIMEOUT_SECONDS" in
          ''|*[!0-9]*)
            echo '::notice::OpenCode review skipped: timeout_seconds must be a positive integer no greater than 3600.'
            echo 'skipped=true' >> "$GITHUB_OUTPUT"
            exit 0
            ;;
        esac
        if [ "$TIMEOUT_SECONDS" -lt 1 ] || [ "$TIMEOUT_SECONDS" -gt 3600 ]; then
          echo '::notice::OpenCode review skipped: timeout_seconds must be a positive integer no greater than 3600.'
          echo 'skipped=true' >> "$GITHUB_OUTPUT"
          exit 0
        fi
        mkdir -p "${GITHUB_WORKSPACE}/.review-context"
        cp "$OPENCODE_PROMPT_PATH" "${GITHUB_WORKSPACE}/.review-context/prompt.md"
        bash "$GITHUB_ACTION_PATH/install-review-project.sh"
        if [ ! -f "$GITHUB_ACTION_PATH/../../../packages/vouchington-tooling/scripts/gha/run-with-timeout.sh" ]; then
          echo '::notice::OpenCode review skipped: run-with-timeout.sh not found relative to GITHUB_ACTION_PATH.'
          echo 'skipped=true' >> "$GITHUB_OUTPUT"
          exit 0
        fi
        bash "$GITHUB_ACTION_PATH/../../../packages/vouchington-tooling/scripts/gha/run-with-timeout.sh" "$TIMEOUT_SECONDS" 30 \
          "$OPENCODE_BIN" run \
          --model "$OPENCODE_MODEL" \
          --agent code-review \
          --auto \
          --dir "$GITHUB_WORKSPACE" \
          'Follow the attached review prompt. Use .review-context for PR title, body, files, diff, and linked issues. Write code-review-payload.json at the repository root.' \
          --file "${GITHUB_WORKSPACE}/.review-context/prompt.md"

    - name: Stage review payload artifact
      id: stage-payload
      if: >-
        always() &&
        steps.review-prompt.outputs.available == 'true' &&
        steps.materialize.outcome == 'success' &&
        steps.trusted-node-version.outcome == 'success' &&
        steps.setup-node.outcome == 'success'
      continue-on-error: true
      shell: bash
      env:
        SOURCE: ${{ github.workspace }}/code-review-payload.json
        DESTINATION: ${{ runner.temp }}/code-review-payload
      run: |
        set -euo pipefail
        node --experimental-strip-types \
          "$GITHUB_ACTION_PATH/../../../packages/vouchington-tooling/src/gha-review-payload/cli.mts" \
          optional "$SOURCE" "$DESTINATION"

    - name: Upload review payload
      id: upload-payload
      if: always() && steps.stage-payload.outcome == 'success' && steps.stage-payload.outputs.staged == 'true'
      continue-on-error: true
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
      with:
        name: code-review-payload-${{ inputs.payload_artifact_name }}
        path: ${{ runner.temp }}/code-review-payload/code-review-payload.json
        if-no-files-found: error
        overwrite: true
        retention-days: 1

    - name: Record agent outcome
      id: agent-result
      if: always()
      shell: bash
      env:
        PROMPT_AVAILABLE: ${{ steps.review-prompt.outputs.available }}
        VERSION_OUTCOME: ${{ steps.trusted-node-version.outcome }}
        SETUP_OUTCOME: ${{ steps.setup-node.outcome }}
        REVIEW_OUTCOME: ${{ steps.opencode-review.outcome }}
        REVIEW_SKIPPED: ${{ steps.opencode-review.outputs.skipped }}
        STAGE_OUTCOME: ${{ steps.stage-payload.outcome }}
        PAYLOAD_STAGED: ${{ steps.stage-payload.outputs.staged }}
        UPLOAD_OUTCOME: ${{ steps.upload-payload.outcome }}
        ARTIFACT_ID: ${{ steps.upload-payload.outputs.artifact-id }}
        PROVIDER_NAME: ${{ inputs.provider_name }}
      run: |
        set -euo pipefail
        outcome=failure
        if [ "$REVIEW_SKIPPED" = 'true' ]; then
          outcome=skipped
        elif [ "$PROMPT_AVAILABLE" = 'true' ] && \
          [ "$VERSION_OUTCOME" = 'success' ] && \
          [ "$SETUP_OUTCOME" = 'success' ] && \
          [ "$REVIEW_OUTCOME" = 'success' ] && \
          [ "$STAGE_OUTCOME" = 'success' ]; then
          if [ "$PAYLOAD_STAGED" != 'true' ] || [ "$UPLOAD_OUTCOME" = 'success' ]; then
            outcome=success
          fi
        fi
        echo "agent_outcome=$outcome" >> "$GITHUB_OUTPUT"
        if [ "$outcome" != 'success' ] && [ "$outcome" != 'skipped' ] && [ -z "$ARTIFACT_ID" ]; then
          echo "::warning::$PROVIDER_NAME Code Review did not complete; no review payload was uploaded."
          echo "⚠️ $PROVIDER_NAME Code Review did not complete; no review payload was uploaded." >> "$GITHUB_STEP_SUMMARY"
        fi

    - name: Clean review payload files
      if: always()
      continue-on-error: true
      shell: bash
      run: |
        set -euo pipefail
        rm -rf \
          "${GITHUB_WORKSPACE}/code-review-payload.json" \
          "${GITHUB_WORKSPACE}/.review-context" \
          "${RUNNER_TEMP}/code-review-payload" \
          "${RUNNER_TEMP}/opencode-review-prompt.md"
        bash "$GITHUB_ACTION_PATH/../code-review/restore-trusted-prompt-dir.sh" || \
          echo '::notice::Could not restore the caller trusted-review-prompt directory; continuing.'
        bash "$GITHUB_ACTION_PATH/restore-review-project.sh" || \
          echo '::notice::Could not restore the caller OpenCode project files; continuing.'
