name: Final review select
description: >
  Select a trusted, tested pull-request head for Final Code Review.
  The caller job must grant issues: write and pull-requests: write so stale
  completion labels can be cleared. issues: write alone 403s PR labels
  (jonathanong/filaments run 33269571876).
outputs:
  should_review:
    description: Whether advisory providers should run
    value: ${{ steps.select.outputs.should_review }}
  gate_status:
    description: Native gate status
    value: ${{ steps.select.outputs.gate_status }}
  pr_number:
    description: Selected pull request number
    value: ${{ steps.select.outputs.pr_number }}
  head_sha:
    description: Selected head SHA
    value: ${{ steps.select.outputs.head_sha }}
  base_sha:
    description: Selected base SHA
    value: ${{ steps.select.outputs.base_sha }}

runs:
  using: composite
  steps:
    - name: Select final review
      id: select
      shell: bash
      run: bash "${GITHUB_ACTION_PATH}/select.sh"
