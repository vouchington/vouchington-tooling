name: Fetch Repository Paths
description: Fetch a validated allowlisted repository bundle through the vouchington CLI.

inputs:
  config:
    description: Absolute path to a schemaVersion-1 repository-path-fetch JSON configuration.
    required: true
  destination:
    description: Absolute destination path, which must not already exist.
    required: true
  metadata:
    description: Absolute path for resolved-SHA and deterministic-digest metadata.
    required: true
  token:
    description: Read-only token for the configured repository.
    required: true
outputs:
  resolved_sha:
    description: Immutable commit SHA resolved from the requested ref.
    value: ${{ steps.fetch.outputs.resolved_sha }}
  digest:
    description: Deterministic SHA-256 bundle digest.
    value: ${{ steps.fetch.outputs.digest }}

runs:
  using: composite
  steps:
    - name: Set up Node.js 24
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version: 24
    - id: fetch
      shell: bash
      env:
        FETCH_REPOSITORY_PATHS_CONFIG: ${{ inputs.config }}
        FETCH_REPOSITORY_PATHS_DESTINATION: ${{ inputs.destination }}
        FETCH_REPOSITORY_PATHS_METADATA: ${{ inputs.metadata }}
        FETCH_REPOSITORY_PATHS_TOKEN: ${{ inputs.token }}
      run: |
        set -euo pipefail
        node --experimental-strip-types \
          "$GITHUB_ACTION_PATH/../../../packages/vouchington-tooling/src/repository-path-fetch/cli.mts" \
          --config "$FETCH_REPOSITORY_PATHS_CONFIG" \
          --destination "$FETCH_REPOSITORY_PATHS_DESTINATION" \
          --metadata "$FETCH_REPOSITORY_PATHS_METADATA" \
          --token-env FETCH_REPOSITORY_PATHS_TOKEN
        node --input-type=module -e '
          import { readFileSync } from "node:fs"
          let metadata
          try { metadata = JSON.parse(readFileSync(process.argv[1], "utf8")) }
          catch { throw new Error("fetch-repository-paths metadata is invalid JSON") }
          if (!metadata || typeof metadata !== "object" || !/^(?:[0-9a-f]{40}|[0-9a-f]{64})$/i.test(metadata.resolvedSha) || !/^[0-9a-f]{64}$/i.test(metadata.digest))
            throw new Error("fetch-repository-paths metadata has invalid resolvedSha or digest")
          process.stdout.write(`resolved_sha=${metadata.resolvedSha}\ndigest=${metadata.digest}\n`)
        ' "$FETCH_REPOSITORY_PATHS_METADATA" >> "$GITHUB_OUTPUT"
